<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - HCA Healthcare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #edf1f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* HCA Brand colors */
        .brand-blue { color: #092240; }
        .brand-orange { color: #E75925; border-color: #E75925; }
        .bg-brand-blue { background-color: #092240; }
        .bg-brand-orange { background-color: #E75925; }
        
        /* Scroll boxes */
        .scroll-box {
            max-height: calc(100vh - 300px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }
        .scroll-box::-webkit-scrollbar {
            width: 8px;
        }
        .scroll-box::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .scroll-box::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .scroll-box::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Sticky table header */
        .table-container {
            position: relative;
        }
        .table-container thead {
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .max-w-7xl {
                max-width: 100%;
            }
            .grid {
                grid-template-columns: 1fr !important;
            }
            .bg-white.rounded-xl {
                padding: 16px !important;
            }
            .table-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            table {
                min-width: 600px;
            }
            .flex.items-center.justify-between {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .flex.items-center.gap-4 {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                width: 100%;
            }
            .text-right {
                text-align: left;
            }
            img.h-12 {
                height: 32px;
            }
            .max-w-md {
                max-width: calc(100% - 32px);
            }
        }
    </style>
</head>
<body class="min-h-screen p-6" style="padding: 12px;">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-sm border-b-4 border-brand-orange p-6 mb-6" style="border-bottom: 3px solid #E75925; box-shadow: 0 2px 8px rgba(9,34,64,0.08);">
            <div class="flex items-center justify-between">
                <div>
                    <img 
                        src="https://www.ucbjournal.com/wp-content/uploads/2022/10/HCA_horizontal_logo_-fullcolor_rgb.png" 
                        alt="HCA Healthcare" 
                        class="h-12 object-contain"
                        onerror="this.style.display='none'"
                    />
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-sm text-gray-600">Logged in as</p>
                        <p class="font-semibold text-gray-900" id="loggedInUser">Kevin</p>
                    </div>
                    <div class="w-12 h-12 bg-brand-blue rounded-full flex items-center justify-center text-white font-bold overflow-hidden" id="userAvatar" style="background-color: #092240;">
                        <span id="userInitials">K</span>
                    </div>
                    <button
                        onclick="handleLogout()"
                        class="ml-4 px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition text-sm"
                    >
                        Logout
                    </button>
                </div>
            </div>
        </div>

        <div class="grid gap-6" style="grid-template-columns: 1.5fr 1fr;" id="mainGrid">
            <!-- LEFT COLUMN - User Management -->
            <div>
                <!-- Users List -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-full flex flex-col">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold text-gray-900">Users</h2>
                        <button
                            onclick="openAddUserModal()"
                            class="px-4 py-2 bg-brand-blue hover:opacity-90 text-white font-semibold rounded-lg transition shadow-sm"
                            style="background-color: #092240;"
                            id="addUserBtn"
                        >
                            + Add User
                        </button>
                    </div>

                    <!-- Users Table -->
                    <div class="table-container scroll-box flex-1">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b border-gray-200">
                                    <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Name</th>
                                    <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Email</th>
                                    <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Role</th>
                                    <th class="text-left py-3 px-4 text-sm font-semibold text-gray-700">Status</th>
                                    <th class="text-right py-3 px-4 text-sm font-semibold text-gray-700">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <!-- Users will be populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN - Activity Logs -->
            <div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-full flex flex-col">
                    <h2 class="text-xl font-bold text-gray-900 mb-6">Activity Logs</h2>
                    
                    <!-- Filter -->
                    <div class="mb-4">
                        <select 
                            id="logFilter"
                            onchange="filterLogs()"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >
                            <option value="all">All Activities</option>
                            <option value="signin">Sign In</option>
                            <option value="signout">Sign Out</option>
                            <option value="failed_login">Failed Login Attempt</option>
                        </select>
                    </div>

                    <!-- Logs List -->
                    <div class="scroll-box flex-1" id="logsContainer">
                        <!-- Logs will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="addUserModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-50" onclick="closeModalOnBackdrop(event)">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4" onclick="event.stopPropagation()">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-xl font-bold text-gray-900">Add New User</h3>
                    <button onclick="closeAddUserModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            <form id="addUserForm" onsubmit="handleAddUser(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                    <input
                        type="text"
                        id="newFirstName"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                    <input
                        type="text"
                        id="newLastName"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input
                        type="email"
                        id="newEmail"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                    <select
                        id="newRole"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        <option value="Super Admin">Super Admin</option>
                        <option value="Regional Manager">Regional Manager</option>
                        <option value="Facility Administrator">Facility Administrator</option>
                        <option value="Operator">Operator</option>
                        <option value="Viewer">Viewer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input
                        type="password"
                        id="newPassword"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Set initial password"
                    />
                    <p class="text-xs text-gray-500 mt-1">User can change this after first login</p>
                </div>
                <div class="flex gap-3 pt-4">
                    <button
                        type="submit"
                        class="flex-1 px-4 py-2 text-white font-semibold rounded-lg transition hover:opacity-90"
                        style="background-color: #092240;"
                    >
                        Add User
                    </button>
                    <button
                        type="button"
                        onclick="closeAddUserModal()"
                        class="flex-1 px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition"
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-50" onclick="closeModalOnBackdrop(event)">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4" onclick="event.stopPropagation()">
            <div class="p-6">
                <h3 class="text-xl font-bold text-gray-900 mb-2">Delete User</h3>
                <p class="text-gray-600 mb-6">Are you sure you want to delete <span id="deleteUserName" class="font-semibold"></span>? This action cannot be undone.</p>
                <div class="flex gap-3">
                    <button
                        onclick="confirmDelete()"
                        class="flex-1 px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition"
                    >
                        Delete
                    </button>
                    <button
                        onclick="closeDeleteModal()"
                        class="flex-1 px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition"
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Failed Login Details Modal -->
    <div id="failedLoginModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-50" onclick="closeModalOnBackdrop(event)">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4" onclick="event.stopPropagation()">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-xl font-bold text-gray-900">Failed Login Attempt Details</h3>
                    <button onclick="closeFailedLoginModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-900" id="failedLoginEmail">
                        -
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password Attempted</label>
                    <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-900 font-mono text-sm" id="failedLoginPassword">
                        -
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Machine / User Agent</label>
                    <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-900 text-sm" id="failedLoginUserAgent">
                        -
                    </div>
                </div>
                <div id="failedLoginIpContainer" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-1">IP Address</label>
                    <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-900 font-mono text-sm" id="failedLoginIp">
                        -
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Timestamp</label>
                    <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-gray-900 text-sm" id="failedLoginTimestamp">
                        -
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button
                        onclick="closeFailedLoginModal()"
                        class="flex-1 px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition"
                    >
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Authentication check - only Kevin can access admin page
        (function() {
            const userStr = sessionStorage.getItem('user');
            const isAdmin = sessionStorage.getItem('isAdmin');
            
            if (!userStr || !isAdmin || isAdmin !== 'true') {
                // Not authenticated or not an admin - redirect to login
                alert('Access denied. Only Kevin can access the admin page.');
                window.location.href = 'login.html';
                return;
            }
            
            const user = JSON.parse(userStr);
            // Double-check it's Kevin
            if (user.firstName.toLowerCase() !== 'kevin') {
                alert('Access denied. Only Kevin can access the admin page.');
                sessionStorage.clear();
                window.location.href = 'login.html';
                return;
            }
        })();

        // Data storage - loaded from API
        let users = [];
        let activityLogs = [];
        let userToDelete = null;

        // Get API base URL
        const API_BASE = window.location.protocol === 'file:' 
            ? 'http://localhost:7071/api'
            : '/api';

        // Load users from API
        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE}/users`);
                if (response.ok) {
                    const data = await response.json();
                    // Transform API response to match frontend format and filter out admin (Kevin)
                    users = data
                        .map(user => ({
                            id: user.id,
                            firstName: user.first_name || user.firstName,
                            lastName: user.last_name || user.lastName,
                            email: user.email,
                            role: user.role,
                            status: user.is_active !== undefined ? (user.is_active ? 'Active' : 'Inactive') : (user.status || 'Active'),
                            first_name: user.first_name,
                            last_name: user.last_name,
                            is_active: user.is_active
                        }))
                        .filter(user => {
                            // Filter out admin user (Kevin)
                            const firstName = (user.first_name || user.firstName || '').toLowerCase();
                            return firstName !== 'kevin';
                        });
                    renderUsers();
                } else {
                    console.error('Failed to load users');
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Load activity logs from API
        async function loadActivityLogs(filter = 'all') {
            try {
                // For failed_login, we need to load all logs to catch both old format (action='signin' with FAILED_LOGIN: prefix)
                // and new format (action='failed_login')
                let url;
                if (filter === 'failed_login') {
                    url = `${API_BASE}/activity?limit=100`;
                } else if (filter === 'all') {
                    url = `${API_BASE}/activity?limit=50`;
                } else {
                    url = `${API_BASE}/activity?action=${filter}&limit=50`;
                }
                
                const response = await fetch(url);
                if (response.ok) {
                    activityLogs = await response.json();
                    renderLogs(filter);
                } else {
                    console.error('Failed to load activity logs');
                }
            } catch (error) {
                console.error('Error loading activity logs:', error);
            }
        }

        function renderUsers() {
            const tbody = document.getElementById('usersTableBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-gray-500">No users found</td></tr>';
                return;
            }
            tbody.innerHTML = users.map(user => {
                // Handle both API response formats (first_name/last_name or firstName/lastName)
                const firstName = user.first_name || user.firstName || '';
                const lastName = user.last_name || user.lastName || '';
                const email = user.email || '';
                const role = user.role || '';
                const status = user.is_active !== undefined ? (user.is_active ? 'Active' : 'Inactive') : (user.status || 'Active');
                
                // Role badge colors
                let roleClass = 'bg-gray-100 text-gray-700';
                if (role === 'Super Admin') roleClass = 'bg-purple-100 text-purple-700';
                else if (role === 'Regional Manager') roleClass = 'bg-blue-100 text-blue-700';
                else if (role === 'Facility Administrator') roleClass = 'bg-green-100 text-green-700';
                else if (role === 'Operator') roleClass = 'bg-yellow-100 text-yellow-700';
                
                return `
                <tr class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="py-3 px-4">
                        <div class="font-medium text-gray-900">${firstName} ${lastName}</div>
                    </td>
                    <td class="py-3 px-4 text-gray-600">${email}</td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 text-xs font-medium rounded-full ${roleClass} whitespace-nowrap inline-block">
                            ${role}
                        </span>
                    </td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 text-xs font-medium rounded-full ${
                            status === 'Active' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'
                        }">
                            ${status}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-right">
                        <button
                            onclick="deleteUser(${user.id})"
                            class="text-red-600 hover:text-red-800 font-medium text-sm cursor-pointer px-2 py-1 rounded hover:bg-red-50 transition"
                            type="button"
                        >
                            Remove
                        </button>
                    </td>
                </tr>
            `;
            }).join('');
        }

        function renderLogs(filter = 'all') {
            const container = document.getElementById('logsContainer');
            if (!container) {
                console.error('logsContainer not found');
                return;
            }
            
            let filteredLogs = [...activityLogs];
            
            if (filter === 'failed_login') {
                // Filter for failed login attempts - handle both old format (action='signin' with FAILED_LOGIN: prefix)
                // and new format (action='failed_login')
                filteredLogs = filteredLogs.filter(log => {
                    const userName = log.user_name || log.userName || '';
                    return log.action === 'failed_login' || 
                           (log.action === 'signin' && userName.startsWith('FAILED_LOGIN:'));
                });
            } else if (filter === 'signin') {
                // For signin filter, exclude failed login attempts (both old and new format)
                filteredLogs = filteredLogs.filter(log => {
                    const userName = log.user_name || log.userName || '';
                    return log.action === 'signin' && !userName.startsWith('FAILED_LOGIN:');
                });
            } else if (filter !== 'all') {
                // Filter by action type
                filteredLogs = filteredLogs.filter(log => log.action === filter);
            }

            // Sort by timestamp (newest first) - already sorted by API, but ensure it
            filteredLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            if (filteredLogs.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">No activity logs found</p>';
                return;
            }
            
            container.innerHTML = filteredLogs.slice(0, 20).map(log => {
                const date = new Date(log.timestamp);
                const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const isSignIn = log.action === 'signin';
                const userName = log.user_name || log.userName || 'Unknown';
                // Check if this is a failed login (new format: action='failed_login' or old format: action='signin' with FAILED_LOGIN: prefix)
                const isFailedLogin = log.action === 'failed_login' || (log.action === 'signin' && userName.startsWith('FAILED_LOGIN:'));
                
                let displayName = userName;
                let displayAction = isSignIn && !isFailedLogin ? 'Signed in' : isFailedLogin ? 'Failed login attempt' : 'Signed out';
                let bgColor = isSignIn && !isFailedLogin ? 'bg-green-500' : isFailedLogin ? 'bg-orange-500' : 'bg-red-500';
                
                if (isFailedLogin) {
                    // Parse failed login - handle both formats
                    let emailPassword = userName;
                    if (userName.startsWith('FAILED_LOGIN: ')) {
                        // Old format: "FAILED_LOGIN: email:password"
                        emailPassword = userName.replace('FAILED_LOGIN: ', '');
                    }
                    // New format: "email:password"
                    const parts = emailPassword.split(':');
                    const attemptedEmail = parts[0] || 'Unknown';
                    const attemptedPassword = parts.slice(1).join(':') || '***';
                    displayName = attemptedEmail;
                    displayAction = `Failed login attempt - Password: ${attemptedPassword}`;
                }
                
                // Make failed login attempts clickable (both old and new format)
                const clickHandler = isFailedLogin ? `onclick="showFailedLoginDetails(${log.id})"` : '';
                const cursorStyle = isFailedLogin ? 'cursor-pointer hover:bg-gray-100' : '';
                
                return `
                    <div class="flex items-start gap-3 p-3 bg-gray-50 rounded-lg mb-3 ${cursorStyle}" ${clickHandler}>
                        <div class="w-2 h-2 rounded-full mt-2 ${bgColor}"></div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <p class="font-medium text-gray-900 text-sm">${displayName}</p>
                                <p class="text-xs text-gray-500">${dateStr} ${timeStr}</p>
                            </div>
                            <p class="text-xs ${isFailedLogin ? 'text-orange-700 font-semibold' : 'text-gray-600'} mt-1">
                                ${displayAction}
                            </p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterLogs() {
            const filter = document.getElementById('logFilter').value;
            loadActivityLogs(filter);
        }

        function openAddUserModal() {
            document.getElementById('addUserModal').classList.remove('hidden');
            document.getElementById('addUserModal').classList.add('flex');
        }

        function closeAddUserModal() {
            document.getElementById('addUserModal').classList.add('hidden');
            document.getElementById('addUserModal').classList.remove('flex');
            document.getElementById('addUserForm').reset();
        }

        function closeModalOnBackdrop(event) {
            if (event.target === event.currentTarget) {
                closeAddUserModal();
                closeDeleteModal();
                closeFailedLoginModal();
            }
        }

        function showFailedLoginDetails(logId) {
            // Find the log entry from activityLogs array
            const log = activityLogs.find(l => l.id == logId || l.id === logId);
            if (!log) {
                console.error('Log entry not found:', logId);
                return;
            }
            
            // Parse failed login data - handle both old and new formats
            const userName = log.user_name || log.userName || '';
            let emailPassword = userName;
            if (userName.startsWith('FAILED_LOGIN: ')) {
                // Old format: "FAILED_LOGIN: email:password"
                emailPassword = userName.replace('FAILED_LOGIN: ', '');
            }
            // New format: "email:password"
            const parts = emailPassword.split(':');
            const attemptedEmail = parts[0] || 'Unknown';
            const attemptedPassword = parts.slice(1).join(':') || '***';
            
            // Get IP address and user agent
            const ipAddress = log.ip_address || 'unknown';
            const userAgent = log.user_agent || 'Unknown';
            
            // Format timestamp
            const timestamp = new Date(log.timestamp);
            const formattedTimestamp = timestamp.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            // Populate modal
            document.getElementById('failedLoginEmail').textContent = attemptedEmail;
            document.getElementById('failedLoginPassword').textContent = attemptedPassword;
            document.getElementById('failedLoginUserAgent').textContent = userAgent;
            document.getElementById('failedLoginTimestamp').textContent = formattedTimestamp;
            
            // Show IP address only if it's not "unknown"
            const ipContainer = document.getElementById('failedLoginIpContainer');
            const ipElement = document.getElementById('failedLoginIp');
            if (ipAddress && ipAddress.toLowerCase() !== 'unknown') {
                ipElement.textContent = ipAddress;
                ipContainer.classList.remove('hidden');
            } else {
                ipContainer.classList.add('hidden');
            }
            
            // Show modal
            document.getElementById('failedLoginModal').classList.remove('hidden');
            document.getElementById('failedLoginModal').classList.add('flex');
        }

        function closeFailedLoginModal() {
            document.getElementById('failedLoginModal').classList.add('hidden');
            document.getElementById('failedLoginModal').classList.remove('flex');
        }

        async function handleAddUser(event) {
            event.preventDefault();
            
            const firstName = document.getElementById('newFirstName').value.trim();
            const lastName = document.getElementById('newLastName').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const role = document.getElementById('newRole').value;
            const password = document.getElementById('newPassword').value;
            
            // Client-side validation
            if (!firstName || !lastName) {
                alert('First name and last name are required');
                return;
            }
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address');
                return;
            }
            
            // Password validation
            if (password.length < 8) {
                alert('Password must be at least 8 characters long');
                return;
            }
            
            const addBtn = document.getElementById('addUserBtn');
            const originalText = addBtn.textContent;
            addBtn.disabled = true;
            addBtn.textContent = 'Adding...';
            
            const newUser = {
                firstName,
                lastName,
                email,
                role,
                password
            };

            try {
                const response = await fetch(`${API_BASE}/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(newUser)
                });

                if (response.ok) {
                    const addedUser = await response.json();
                    // Transform API response to match frontend format
                    const transformedUser = {
                        id: addedUser.id,
                        firstName: addedUser.first_name || addedUser.firstName,
                        lastName: addedUser.last_name || addedUser.lastName,
                        email: addedUser.email,
                        role: addedUser.role,
                        status: addedUser.is_active ? 'Active' : 'Inactive'
                    };
                    users.push(transformedUser);
                    renderUsers();
                    loadActivityLogs(document.getElementById('logFilter').value);
                    closeAddUserModal();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Failed to add user');
                }
            } catch (error) {
                console.error('Error adding user:', error);
                alert('Failed to add user. Please try again.');
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = originalText;
            }
        }

        function deleteUser(userId) {
            // Convert to number if it's a string
            const id = typeof userId === 'string' ? parseInt(userId, 10) : userId;
            const user = users.find(u => u.id == id || u.id === id);
            if (user) {
                userToDelete = user;
                const firstName = user.first_name || user.firstName || '';
                const lastName = user.last_name || user.lastName || '';
                document.getElementById('deleteUserName').textContent = `${firstName} ${lastName}`;
                document.getElementById('deleteModal').classList.remove('hidden');
                document.getElementById('deleteModal').classList.add('flex');
            } else {
                console.error('User not found:', userId, 'Available users:', users.map(u => ({ id: u.id, type: typeof u.id })));
                alert('User not found');
            }
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').classList.remove('flex');
            userToDelete = null;
        }

        async function confirmDelete() {
            if (!userToDelete) {
                console.error('No user selected for deletion');
                alert('No user selected for deletion');
                return;
            }
            
            const deleteBtn = document.querySelector('#deleteModal button[onclick="confirmDelete()"]');
            if (!deleteBtn) {
                console.error('Delete button not found');
                return;
            }
            
            const originalText = deleteBtn.textContent;
            deleteBtn.disabled = true;
            deleteBtn.textContent = 'Deleting...';
            
            try {
                const userId = userToDelete.id;
                console.log('Deleting user with ID:', userId);
                const response = await fetch(`${API_BASE}/users/${userId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                if (response.ok) {
                    const result = await response.json().catch(() => ({}));
                    console.log('User deleted successfully:', result);
                    users = users.filter(u => u.id != userId && u.id !== userId);
                    renderUsers();
                    loadActivityLogs(document.getElementById('logFilter').value);
                    closeDeleteModal();
                } else {
                    const errorText = await response.text();
                    let error;
                    try {
                        error = JSON.parse(errorText);
                    } catch {
                        error = { error: errorText || 'Failed to delete user' };
                    }
                    console.error('Delete failed:', response.status, error);
                    alert(error.error || 'Failed to delete user');
                }
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('Failed to delete user: ' + error.message);
            } finally {
                deleteBtn.disabled = false;
                deleteBtn.textContent = originalText;
            }
        }


        // Set logged in user name and profile picture
        (function() {
            const userStr = sessionStorage.getItem('user');
            if (userStr) {
                const user = JSON.parse(userStr);
                const userNameEl = document.getElementById('loggedInUser');
                const userInitialsEl = document.getElementById('userInitials');
                const userAvatarEl = document.getElementById('userAvatar');
                
                if (userNameEl) {
                    userNameEl.textContent = `${user.firstName} ${user.lastName}`;
                }
                
                if (userAvatarEl) {
                    const first = (user.firstName && String(user.firstName).trim()[0]) || '';
                    const last = (user.lastName && String(user.lastName).trim()[0]) || '';
                    const initials = (first + last).toUpperCase() || (user.email && user.email[0]) || '?';
                    
                    if (user.photoUrl) {
                        // Show profile picture
                        userAvatarEl.innerHTML = `<img src="${user.photoUrl}" alt="${user.firstName} ${user.lastName}" style="width: 100%; height: 100%; object-fit: cover;" referrerPolicy="no-referrer" />`;
                    } else {
                        // Show initials
                        if (userInitialsEl) {
                            userInitialsEl.textContent = initials;
                        } else {
                            userAvatarEl.textContent = initials;
                        }
                    }
                }
            }
        })();

        // Responsive grid handling
        function updateGridLayout() {
            const grid = document.getElementById('mainGrid');
            if (grid && window.innerWidth < 768) {
                grid.style.gridTemplateColumns = '1fr';
            } else if (grid) {
                grid.style.gridTemplateColumns = '1.5fr 1fr';
            }
        }
        
        window.addEventListener('resize', updateGridLayout);
        updateGridLayout();

        // Logout function
        async function handleLogout() {
            const userStr = sessionStorage.getItem('user');
            let userId = null;
            let userName = 'Unknown';
            
            if (userStr) {
                const user = JSON.parse(userStr);
                userId = user.id;
                userName = `${user.firstName} ${user.lastName}`;
            }
            
            try {
                // Call logout API
                await fetch(`${API_BASE}/auth/logout`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ userId, userName })
                });
            } catch (error) {
                console.error('Logout API error:', error);
                // Continue with logout even if API call fails
            }
            
            // Clear session storage and redirect to login
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        // Initialize - load data from API
        loadUsers();
        loadActivityLogs();

        // Refresh activity logs every 30 seconds
        setInterval(() => {
            loadActivityLogs(document.getElementById('logFilter').value);
        }, 30000);
    </script>
</body>
</html>
